# PD-audit R-04 (docs/audit/pd-post-p0-2026-09-12): /sub/<token> — bearer-секрет,
# его нельзя писать в access-лог в открытом виде. Маскируем path-сегмент, сохраняя
# наблюдаемость: статус/UA остаются (перебор токенов виден как 404-шторм),
# query (?client=…) сохраняется — секрет только в самом токене.
map $request_uri $request_uri_masked {
    ~^/sub/[^/?]*(\?.*)?$ /sub/<TOKEN>$1;
    # /auth/<token> — та же ссылка-подписка (bearer-секрет), что и /sub/.
    ~^/auth/[^/?]*(\?.*)?$ /auth/<TOKEN>$1;
    # Страница и API проверки подключения несут тот же bearer-токен, что /sub/.
    # ping/speed секрета не содержат — оставляем видимыми для наблюдаемости.
    ~^/check/[^/?]*(\?.*)?$ /check/<TOKEN>$1;
    ~^/api/v1/check/(ping|speed)(\?.*)?$ /api/v1/check/$1$2;
    ~^/api/v1/check/[^/?]*(/result|/feedback)?(\?.*)?$ /api/v1/check/<TOKEN>$1$2;
    default $request_uri;
}

# PD-audit (инвариант «IP пользователей не сохраняются»): в access-лог пишем не
# полный $remote_addr, а маскированный префикс подсети — IPv4 /24 (последний октет
# в 0) и IPv6 /64 (первые 4 гекстета + ::). Сжатые IPv6-записи (<4 гекстетов до
# «::») и прочие непарсящиеся значения -> константа. Маска подсети сохраняет
# наблюдаемость (шквал 404 с одной подсети = перебор токенов), но адрес
# конкретного человека не идентифицирует. Полный IP живёт только в shared memory
# limit_req-зон ниже — на диск не попадает.
map $remote_addr $remote_addr_masked {
    ~^(?<mask_v4>\d+\.\d+\.\d+)\.\d+$ ${mask_v4}.0;
    "~^(?<mask_v6>(?:[0-9A-Fa-f]{1,4}:){3}[0-9A-Fa-f]{1,4}):" ${mask_v6}::;
    ~: ipv6;
    default $remote_addr;
}

# Состав полей — как у stock-формата main из базового nginx.conf, но $request
# заменён на "$request_method $request_uri_masked $server_protocol", IP — на
# маскированную подсеть ($remote_addr_masked), X-Forwarded-For убран совсем
# (может нести клиентский IP и спуфится клиентом). access_log в server-блоках
# ниже перекрывает http-уровневый main-формат целиком.
log_format pdmain '$remote_addr_masked - $remote_user [$time_local] '
                  '"$request_method $request_uri_masked $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Brute-force защита (PD-audit): nginx-уровневые лимиты per-IP. Ключ
# $binary_remote_addr (4/16 байт) живёт только в shared memory зоны — на диск
# не пишется, при reload контейнера исчезает. Это заменяет «сырую» защиту,
# которую раньше давал сам факт записи IP в лог.
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=sub_tokens:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=tg_webhook:10m rate=50r/s;
limit_req_status 429;

server {
    listen 80;
    server_name bravada-connect.ru www.bravada-connect.ru;

    # :80 сюда прилетает и 301-редирект с /sub/<token> — маскируем и его.
    access_log /var/log/nginx/access.log pdmain;


    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /healthz {
        proxy_pass http://backend:8000;
    }

    location / {
        return 301 https://bravada-connect.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.bravada-connect.ru;

    # PD-audit R-04: редирект несёт $request_uri с токеном — маскируем и здесь,
    # иначе www-виртухост наследует http-уровневый main-формат (plain /sub/<token>).
    access_log /var/log/nginx/access.log pdmain;

    ssl_certificate /etc/letsencrypt/live/bravada-connect.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bravada-connect.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    return 301 https://bravada-connect.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name bravada-connect.ru;

    # PD-audit R-04: маскированный формат (см. map/log_format выше) —
    # перекрывает http-уровневый main, который писал /sub/<token> в открытом виде.
    access_log /var/log/nginx/access.log pdmain;


    # Сертификат читается напрямую из Docker-тома `certs`, куда его продлевает
    # certbot-сервис (renew каждые 12ч; nginx-контейнер делает reload каждые 6ч —
    # см. command в docker-compose.prod.yml). НЕ возвращать к bind-mount ./ssl:
    # 2026-08-20 сайт и бот лежали сутки — certbot продлевал в том, nginx читал
    # устаревшую копию в ./ssl, и 90-дневный сертификат молча истёк.
    ssl_certificate /etc/letsencrypt/live/bravada-connect.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bravada-connect.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # OCSP stapling убран: Let's Encrypt прекратил OCSP для новых сертификатов
    # (AIA без responder-URL) — директивы стали no-op и сыпали warning на каждый
    # reload. Отзыв теперь проверяется CRL-ами на стороне клиента.

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Запрос ссылки входа — точка брутфорса адресов/токенов: режем перебор ещё
    # на nginx (app-лимитер за proxy видит только IP прокси). Exact-match.
    location = /api/v1/auth/link/request {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sub/ {
        # VPN-клиенты поллят подписку (Karing и др.) — burst с запасом;
        # перебор токенов всё равно упирается в 5r/s.
        limit_req zone=sub_tokens burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /readyz {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /telegram/webhook {
        # Telegram ретраит неотданные апдейты — потеря недопустима: широкий
        # burst; сам webhook закрыт secret_token-проверкой на стороне бэкенда.
        limit_req zone=tg_webhook burst=200 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        # Link-auth (!156): страница входа по ссылке-подписке живёт во фронтенде
        # ((site)/auth/[token]); у бэкенда голых /auth/*-роутов нет. Изначальный
        # proxy_pass на backend был мёртвым конфигом (404) до появления ссылок.
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /downloads/ {
        # Self-hosted client binaries (Karing APK; later Windows .exe) — host dir
        # bind-mounted read-only, NOT in the repo (files are too large for git).
        # Also serves latest-android.json, the manifest the bot + web frontend
        # read to resolve the always-latest APK download link.
        alias /var/www/downloads/;
        types {
            application/vnd.android.package-archive apk;
            application/octet-stream exe;
            application/json json;
        }
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
