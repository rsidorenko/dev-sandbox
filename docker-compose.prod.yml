# Production deployment — nginx + certbot + backend + frontend + postgres
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Variables are read from backend/.env (or .env at repo root).
# Copy .env.example to .env and fill in real values before first run.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vpnbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vpnbot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "password_encryption=md5"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpnbot} -d ${POSTGRES_DB:-vpnbot}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vpnbot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vpnbot}?sslmode=disable
      APP_ENV: production
      PORT: "8000"
      SLICE1_USE_POSTGRES_REPOS: "1"
      TELEGRAM_WEBHOOK_HTTP_ENABLE: "1"
      TELEGRAM_WEBHOOK_SECRET_TOKEN: ${TELEGRAM_WEBHOOK_SECRET_TOKEN:-}
      TELEGRAM_WEBHOOK_PUBLIC_URL: ${TELEGRAM_WEBHOOK_PUBLIC_URL:?Set TELEGRAM_WEBHOOK_PUBLIC_URL in .env}
      TELEGRAM_WEBHOOK_ALLOWED_UPDATES: ${TELEGRAM_WEBHOOK_ALLOWED_UPDATES:-message,callback_query}
      WEB_API_ENABLE: "1"
      WEB_API_CORS_ORIGINS: ${WEB_API_CORS_ORIGINS:-}
      TELEGRAM_STOREFRONT_CHECKOUT_URL: ${TELEGRAM_STOREFRONT_CHECKOUT_URL:-}
      TELEGRAM_STOREFRONT_RENEWAL_URL: ${TELEGRAM_STOREFRONT_RENEWAL_URL:-}
      TELEGRAM_STOREFRONT_SUPPORT_URL: ${TELEGRAM_STOREFRONT_SUPPORT_URL:-}
      TELEGRAM_STOREFRONT_PLAN_NAME: ${TELEGRAM_STOREFRONT_PLAN_NAME:-}
      TELEGRAM_STOREFRONT_PLAN_PRICE: ${TELEGRAM_STOREFRONT_PLAN_PRICE:-}
      PAYMENT_FULFILLMENT_HTTP_ENABLE: ${PAYMENT_FULFILLMENT_HTTP_ENABLE:-1}
      PAYMENT_FULFILLMENT_WEBHOOK_SECRET: ${PAYMENT_FULFILLMENT_WEBHOOK_SECRET:-}
      TELEGRAM_CHECKOUT_REFERENCE_SECRET: ${TELEGRAM_CHECKOUT_REFERENCE_SECRET:-}
      TELEGRAM_CHECKOUT_REFERENCE_MAX_AGE_SECONDS: ${TELEGRAM_CHECKOUT_REFERENCE_MAX_AGE_SECONDS:-604800}
      TELEGRAM_ACCESS_RESEND_ENABLE: ${TELEGRAM_ACCESS_RESEND_ENABLE:-1}
      ACCESS_RECONCILE_SCHEDULE_ACK: "1"
      ACCESS_RECONCILE_MAX_INTERVAL_SECONDS: ${ACCESS_RECONCILE_MAX_INTERVAL_SECONDS:-1800}
      SUBSCRIPTION_DEFAULT_PERIOD_DAYS: ${SUBSCRIPTION_DEFAULT_PERIOD_DAYS:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-1}
      JWT_SECRET: ${JWT_SECRET:-}
      WEB_ADMIN_ENABLE: ${WEB_ADMIN_ENABLE:-}
      WEB_ADMIN_USERNAME: ${WEB_ADMIN_USERNAME:-}
      WEB_ADMIN_PASSWORD: ${WEB_ADMIN_PASSWORD:-}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:-}
      JWT_ADMIN_TTL_MINUTES: ${JWT_ADMIN_TTL_MINUTES:-}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-}
      EMAIL_CODE_TTL_MINUTES: ${EMAIL_CODE_TTL_MINUTES:-}
      WEB_API_DEV_INSECURE_COOKIE: ${WEB_API_DEV_INSECURE_COOKIE:-}
      YOOKASSA_ENABLED: ${YOOKASSA_ENABLED:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_API_KEY: ${YOOKASSA_API_KEY:-}
      YOOKASSA_WEBHOOK_SECRET: ${YOOKASSA_WEBHOOK_SECRET:-}
      # CryptoBot (crypto) payments — same fulfillment path as YooKassa; the webhook
      # route is always mounted, CRYPTOBOT_ENABLED only gates invoice creation.
      CRYPTOBOT_ENABLED: ${CRYPTOBOT_ENABLED:-}
      CRYPTOBOT_API_TOKEN: ${CRYPTOBOT_API_TOKEN:-}
      CRYPTOBOT_PROVIDER_KEY: ${CRYPTOBOT_PROVIDER_KEY:-cryptobot_v1}
      CRYPTOBOT_TESTNET: ${CRYPTOBOT_TESTNET:-}
      CRYPTOBOT_INVOICE_TTL_SECONDS: ${CRYPTOBOT_INVOICE_TTL_SECONDS:-3600}
      BOT_USERNAME: ${BOT_USERNAME:-}
      ISSUANCE_OPERATOR_ENABLE: ${ISSUANCE_OPERATOR_ENABLE:-}
      ADM02_ENSURE_ACCESS_ENABLE: ${ADM02_ENSURE_ACCESS_ENABLE:-}
      XUI_ENABLED: ${XUI_ENABLED:?Set XUI_ENABLED to 1 in .env}
      XUI_VERIFY_SSL: ${XUI_VERIFY_SSL:-1}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      SUBSCRIPTION_BASE_URL: ${SUBSCRIPTION_BASE_URL:-https://bravada-connect.ru}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://bravada-connect.ru}
      # /sub/: Happ-импортам добавлять заголовок `routing` с профилем
      # happ://routing/onadd/… (RU-приложения — Озон/MAX/VK/Яндекс.Музыка/
      # Т-Банк → direct с жилого IP клиента). Пусто/0 = прежнее поведение
      # (только base64-список ссылок).
      SUB_HAPP_ROUTING_ENABLE: ${SUB_HAPP_ROUTING_ENABLE:-}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      # Cloud.ru bare-xray Happ relay: mirror_cloudru_clients.py SSHes here to sync
      # active users' VLESS UUIDs onto the relay entry (provider_kind='bare_xray', no
      # panel). Non-secret values (host/user/path); the key FILE is the secret, bind
      # mounted from a deploy-safe host path (outside /opt/bravada, which deploy wipes).
      CLOUDRU_SSH_HOST: "85.208.87.187"
      CLOUDRU_SSH_USER: "romtan"
      CLOUDRU_SSH_KEY: "/opt/bravada/cloudru_key.pem"
      # xray gRPC API port (HandlerService) on the bare_xray box — localhost, reached over SSH.
      CLOUDRU_XRAY_API_PORT: "10085"
    volumes:
      # Bind-mount the Cloud.ru SSH key from /root/.ssh (survives deploy's rm -rf
      # /opt/bravada, which preserves only .env + ssl/). Read-only in the container.
      # Used by BOTH bare_xray entries (id=26/27 Frankfurt + id=28/29 Helsinki) — the
      # Helsinki-entry cloud.ru box reuses the same key/user, so no per-row mount is needed.
      - /root/.ssh/cloudru_key.pem:/opt/bravada/cloudru_key.pem:ro
      # Separate key for the CDN whitelist-bypass "Литва" bare_xray row (origin 89.169.153.112,
      # GCP VM 'whitelist2'). That host uses user romtan + its own ed25519 key (not cloudru_key),
      # so the row sets per-row ssh_user/ssh_key_path (mig 059) which override CLOUDRU_SSH_*.
      - /root/.ssh/romtan_key.pem:/opt/bravada/romtan_key.pem:ro
      # Read-only mount of the self-hosted client downloads dir (same one nginx
      # serves) so the bot can read latest-android.json to resolve the always-latest
      # Karing APK link for Android step 1. Survives deploy (rm -rf /opt/bravada).
      - /opt/bravada-downloads:/var/www/downloads:ro
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://bravada-connect.ru}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://bravada-connect.ru}
        NEXT_PUBLIC_YM_ID: ${NEXT_PUBLIC_YM_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    # Периодический graceful reload, чтобы nginx подхватывал продлённый certbot'ом
    # сертификат из тома `certs` (certbot renew — каждые 12ч, reload — каждые 6ч,
    # максимальный лаг применения — 6ч). Канонический паттерн certbot↔nginx;
    # без этого reload не происходит вообще: nginx кеширует сертификат с старта.
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - certs:/etc/letsencrypt:ro
      - /opt/bravada-downloads:/var/www/downloads:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  certbot-www:
  certs:
