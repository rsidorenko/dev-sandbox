# ════════════════════════════════════════════════════════════════════════════
# CODEGRAPH (порт codegraph-check)
# ════════════════════════════════════════════════════════════════════════════
codegraph:check:
  stage: lint
  image: node:20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [backend/**, frontend/**, .codegraph/**, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == "main"
      changes: [backend/**, frontend/**, .codegraph/**, .gitlab-ci.yml]
    - when: manual
      allow_failure: true
  interruptible: true
  before_script:
    - npm i -g @colbymchenry/codegraph
  script:
    - codegraph init -i
    - codegraph status
    - |
      FILE_COUNT=$(codegraph files --json | node -e "
        const chunks = [];
        process.stdin.on('data', c => chunks.push(c));
        process.stdin.on('end', () => {
          const files = JSON.parse(Buffer.concat(chunks).toString());
          console.log(files.length);
        });
      ")
      echo "Indexed $FILE_COUNT files"
      if [ "$FILE_COUNT" -lt 100 ]; then
        echo "FAIL: CodeGraph indexed fewer than 100 files — expected 400+"
        exit 1
      fi
      echo "OK: CodeGraph index looks healthy ($FILE_COUNT files)"

# ════════════════════════════════════════════════════════════════════════════
# FRONTEND (порт frontend-ci: lint/typecheck/build/unit/e2e + gate)
# ════════════════════════════════════════════════════════════════════════════
frontend:lint:
  stage: lint
  image: node:20
  extends: .frontend-rules
  interruptible: true
  cache:
    key: npm-frontend
    paths: [frontend/node_modules]
  script:
    - cd frontend && npm ci && npm run lint

frontend:typecheck:
  stage: lint
  image: node:20
  extends: .frontend-rules
  interruptible: true
  cache:
    key: npm-frontend
    paths: [frontend/node_modules]
  script:
    - cd frontend && npm ci && npx tsc --noEmit

frontend:unit:
  stage: test
  image: node:20
  extends: .frontend-rules
  interruptible: true
  cache:
    key: npm-frontend
    paths: [frontend/node_modules]
  script:
    - cd frontend && npm ci && npm run test

frontend:build:
  stage: build
  image: node:20
  extends: .manual-rules
  needs: ["frontend:lint", "frontend:typecheck"]
  cache:
    key: npm-frontend
    paths: [frontend/node_modules]
  script:
    - cd frontend
    - npm ci
    - npm run build
    - test -d .next/standalone

frontend:e2e:
  stage: e2e
  image: node:20
  extends: .manual-rules
  needs: ["frontend:unit", "frontend:build"]
  cache:
    key: npm-frontend
    paths: [frontend/node_modules]
  script:
    - cd frontend
    - npm ci
    - npx playwright install --with-deps chromium
    - npm run test:e2e
  artifacts:
    when: on_failure
    paths:
      - frontend/playwright-report
      - frontend/test-results
    expire_in: 7 days

# Единый гейт: падает, если любая проверка фронтенда не success
# (аналог job `gate` в frontend-ci — сделать обязательным в Protected Branches).
frontend:gate:
  stage: e2e
  image: alpine:3.20
  extends: .manual-rules
  needs: ["frontend:lint", "frontend:typecheck", "frontend:build", "frontend:unit", "frontend:e2e"]
  script:
    - exit 0

# ════════════════════════════════════════════════════════════════════════════
# DEPLOY (порт deploy.yml, ядро). Запуск по push в main ИЛИ вручную.
# Секреты из CI-Variables ($SERVER_SSH_KEY типа File, $SERVER_HOST, $SERVER_USER).
# Никшевые операторские тогглы (reissue/cleanup/sync/диагностики) — отдельно/инкрементально.
# ════════════════════════════════════════════════════════════════════════════
deploy:
  stage: deploy
  image: ubuntu:24.04
  rules:
    # Авто-деплой на push в main ТОЛЬКО когда секреты заданы (иначе — упадёт и потратит минуты).
    - if: $CI_COMMIT_BRANCH == "main" && $SERVER_SSH_KEY && $SERVER_HOST && $SERVER_USER
    - when: manual
      allow_failure: true
  variables:
    RUN_HARDENING: "false"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq openssh-client rsync sshpass curl jq python3 > /dev/null
    - eval $(ssh-agent -s)
    - chmod 400 "$SERVER_SSH_KEY"
    - ssh-add "$SERVER_SSH_KEY"
    - mkdir -p ~/.ssh
    - printf 'Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null\n' > ~/.ssh/config
  script:
    - |
      set -e
      echo "=== Build deploy artifact (exclude non-runtime) ==="
      mkdir -p bravada-deploy
      rsync -a --delete \
        --exclude='.git' --exclude='.github' --exclude='.gitlab-ci.yml' \
        --exclude='.codegraph' --exclude='.claude' --exclude='scripts/codegraph' \
        --exclude='node_modules' --exclude='coverage' --exclude='logs' \
        --exclude='tmp' --exclude='temp' --exclude='.cursor' --exclude='.vscode' \
        --exclude='.idea' --exclude='.pytest_cache' --exclude='.mypy_cache' --exclude='.ruff_cache' \
        --exclude='frontend/node_modules' --exclude='frontend/.next' \
        --exclude='*.log' --exclude='.env' --exclude='.env.*' --exclude='bravada-deploy' \
        ./ bravada-deploy/

      echo "=== Upload artifact to server ==="
      ssh "$SERVER_USER@$SERVER_HOST" 'rm -rf /opt/bravada-release && mkdir -p /opt/bravada-release'
      rsync -az --delete -e ssh bravada-deploy/ "$SERVER_USER@$SERVER_HOST:/opt/bravada-release/"

      echo "=== Run deploy on server (swap + docker compose) ==="
      ssh "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
      set -e
      cd /opt/bravada
      echo "=== Pre-deploy DB backup (страховка; БД и так в named-volume pgdata, deploy его не трогает) ==="
      mkdir -p /opt/bravada-backups
      docker compose -f docker-compose.prod.yml exec -T postgres pg_dump -U vpnbot vpnbot 2>/dev/null | gzip > "/opt/bravada-backups/db-$(date +%Y%m%d-%H%M%S).sql.gz" || echo "  pg_dump skipped (non-fatal; БД в volume всё равно цела)"
      ls -t /opt/bravada-backups/db-*.sql.gz 2>/dev/null | tail -n +11 | xargs -r rm -f
      cp -p backend/.env /tmp/backend.env.backup 2>/dev/null || true
      cp -p .env /tmp/root.env.backup 2>/dev/null || true
      cp -rp ssl /tmp/ssl.backup 2>/dev/null || true
      rm -rf /opt/bravada
      mv /opt/bravada-release /opt/bravada
      cp -p /tmp/backend.env.backup /opt/bravada/backend/.env 2>/dev/null || true
      cp -p /tmp/root.env.backup /opt/bravada/.env 2>/dev/null || true
      cp -a /tmp/ssl.backup/. /opt/bravada/ssl/ 2>/dev/null || true
      echo "--- Verify excluded paths absent ---"
      test ! -e /opt/bravada/.codegraph || { echo "FAIL: .codegraph on server"; exit 1; }
      test ! -e /opt/bravada/.claude || { echo "FAIL: .claude on server"; exit 1; }
      test ! -e /opt/bravada/scripts/codegraph || { echo "FAIL: scripts/codegraph on server"; exit 1; }
      echo "--- Build + start containers ---"
      cd /opt/bravada
      docker compose -f docker-compose.prod.yml build --no-cache
      docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate \
        || docker compose -f docker-compose.prod.yml up -d --remove-orphans
      docker image prune -f
      docker builder prune -f || true
      echo "Deploy complete: $(date)"
      bash /opt/bravada/backend/scripts/install_reprovision_timer.sh || true
      bash /opt/bravada/backend/scripts/install_reconcile_bare_xray_timer.sh || true
      REMOTE

      echo "=== Verify healthz ==="
      sleep 8
      ssh "$SERVER_USER@$SERVER_HOST" 'curl -sf http://127.0.0.1:8000/healthz && echo " OK" || echo " FAILED"' || true

      echo "=== Refresh Karing client binaries (public upstream, no GitHub account needed) ==="
      ./scripts/ci/fetch_karing_clients.sh "$SERVER_USER@$SERVER_HOST" || echo "Karing refresh skipped (non-fatal)"
  environment:
    name: production
