# ════════════════════════════════════════════════════════════════════════════
# CODEGRAPH (порт codegraph-check)
# ════════════════════════════════════════════════════════════════════════════
codegraph:check:
  stage: lint
  image: node:20
  rules:
    # Гейты идут всегда (см. комментарий у .backend-rules).
    - when: on_success
  interruptible: true
  before_script:
    - npm i -g @colbymchenry/codegraph
  script:
    - codegraph init -i
    - codegraph status
    - |
      FILE_COUNT=$(codegraph files --json | node -e "
        const chunks = [];
        process.stdin.on('data', c => chunks.push(c));
        process.stdin.on('end', () => {
          const files = JSON.parse(Buffer.concat(chunks).toString());
          console.log(files.length);
        });
      ")
      echo "Indexed $FILE_COUNT files"
      if [ "$FILE_COUNT" -lt 100 ]; then
        echo "FAIL: CodeGraph indexed fewer than 100 files — expected 400+"
        exit 1
      fi
      echo "OK: CodeGraph index looks healthy ($FILE_COUNT files)"

# ════════════════════════════════════════════════════════════════════════════
# FRONTEND (порт frontend-ci: lint/typecheck/build/unit/e2e + gate)
# ════════════════════════════════════════════════════════════════════════════
frontend:lint:
  stage: lint
  image: node:20
  extends: .frontend-rules
  interruptible: true
  cache:
    key: npm-frontend-v2
    paths: [frontend/.npm]
  script:
    - cd frontend && npm ci && npm audit --omit=dev --audit-level=high && npm run lint

frontend:typecheck:
  stage: lint
  image: node:20
  extends: .frontend-rules
  interruptible: true
  cache:
    key: npm-frontend-v2
    paths: [frontend/.npm]
  script:
    - cd frontend && npm ci && npx tsc --noEmit

frontend:unit:
  stage: test
  image: node:20
  extends: .frontend-rules
  interruptible: true
  cache:
    key: npm-frontend-v2
    paths: [frontend/.npm]
  script:
    - cd frontend && npm ci && npm run test

frontend:build:
  stage: build
  image: node:20
  extends: .frontend-rules
  needs: ["frontend:lint", "frontend:typecheck"]
  cache:
    key: npm-frontend-v2
    paths: [frontend/.npm]
  script:
    - cd frontend
    - npm ci
    - npm run build
    - test -d .next/standalone

frontend:e2e:
  stage: e2e
  image: node:20
  extends: .frontend-rules
  needs: ["frontend:unit", "frontend:build"]
  cache:
    key: npm-frontend-v2
    paths: [frontend/.npm]
  script:
    - cd frontend
    - npm ci
    - npx playwright install --with-deps chromium
    - npm run test:e2e
  artifacts:
    when: on_failure
    paths:
      - frontend/playwright-report
      - frontend/test-results
    expire_in: 7 days

# Единый гейт: падает, если любая проверка фронтенда не success
# (аналог job `gate` в frontend-ci — сделать обязательным в Protected Branches).
frontend:gate:
  stage: e2e
  image: alpine:3.20
  extends: .frontend-rules
  needs: ["frontend:lint", "frontend:typecheck", "frontend:build", "frontend:unit", "frontend:e2e"]
  script:
    - exit 0

# ════════════════════════════════════════════════════════════════════════════
# DEPLOY (порт deploy.yml, ядро). Запуск по push в main ИЛИ вручную.
# Секреты из CI-Variables ($SERVER_SSH_KEY типа File, $SERVER_HOST, $SERVER_USER).
# Никшевые операторские тогглы (reissue/cleanup/sync/диагностики) — отдельно/инкрементально.
# ════════════════════════════════════════════════════════════════════════════
deploy:
  stage: deploy
  # alpine+apk вместо ubuntu+apt: зеркала Canonical рвут соединения с IP раннера
  # (apt виснет на CLOSE_WAIT по 20-35 мин), а dl-cdn.alpinelinux.org (Fastly) — другой CDN.
  image: alpine:3.20
  needs: []
  rules:
    # Авто-деплой на push в main ТОЛЬКО когда секреты заданы (иначе — упадёт и потратит минуты).
    - if: $CI_COMMIT_BRANCH == "main" && $SERVER_SSH_KEY && $SERVER_HOST && $SERVER_USER
    - when: manual
      allow_failure: true
  variables:
    RUN_HARDENING: "false"
  before_script:
    # bash — для scripts/ci/fetch_karing_clients.sh (вызывается ниже явно через bash)
    - apk add --no-cache openssh-client rsync sshpass curl jq python3 bash
    - eval $(ssh-agent -s)
    - printf '%s' "$SERVER_SSH_KEY" | base64 -d > /tmp/deploy_key && chmod 400 /tmp/deploy_key && ssh-add /tmp/deploy_key
    - mkdir -p ~/.ssh
    - printf 'Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null\n' > ~/.ssh/config
  script:
    - |
      set -e
      echo "=== Build deploy artifact (exclude non-runtime) ==="
      mkdir -p bravada-deploy
      rsync -a --delete \
        --exclude='.git' --exclude='.github' --exclude='.gitlab-ci.yml' \
        --exclude='.codegraph' --exclude='.claude' --exclude='scripts/codegraph' \
        --exclude='node_modules' --exclude='coverage' --exclude='logs' \
        --exclude='tmp' --exclude='temp' --exclude='.cursor' --exclude='.vscode' \
        --exclude='.idea' --exclude='.pytest_cache' --exclude='.mypy_cache' --exclude='.ruff_cache' \
        --exclude='frontend/node_modules' --exclude='frontend/.next' \
        --exclude='*.log' --exclude='.env' --exclude='.env.*' --exclude='bravada-deploy' \
        ./ bravada-deploy/

      echo "=== Upload artifact to server ==="
      ssh "$SERVER_USER@$SERVER_HOST" 'rm -rf /opt/bravada-release && mkdir -p /opt/bravada-release'
      rsync -az --delete -e ssh bravada-deploy/ "$SERVER_USER@$SERVER_HOST:/opt/bravada-release/"

      echo "=== Run deploy on server (swap + docker compose) ==="
      scp -o StrictHostKeyChecking=no scripts/ci/deploy_remote.sh "$SERVER_USER@$SERVER_HOST:/tmp/bravada_deploy_remote.sh"
      ssh "$SERVER_USER@$SERVER_HOST" 'bash /tmp/bravada_deploy_remote.sh && rm -f /tmp/bravada_deploy_remote.sh'

      echo "=== Verify healthz ==="
      sleep 8
      ssh "$SERVER_USER@$SERVER_HOST" 'curl -sf http://127.0.0.1:8000/healthz && echo " OK" || echo " FAILED"' || true

      echo "=== Refresh Karing client binaries (public upstream, no GitHub account needed) ==="
      bash scripts/ci/fetch_karing_clients.sh "$SERVER_USER@$SERVER_HOST" || echo "Karing refresh skipped (non-fatal)"
  environment:
    name: production
