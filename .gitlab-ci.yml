# GitLab CI/CD — порт .github/workflows/* (backend-ci, backend-postgres-mvp-smoke-validation,
# codegraph-check, frontend-ci, deploy). Проект публичный → бесплатные минуты CI на GitLab.com.
#
# Секреты (Settings → CI/CD → Variables), типичный набор:
#   SERVER_HOST, SERVER_USER, SERVER_SSH_KEY (тип File — приватный ключ деплоя),
#   FIELD_ENCRYPTION_KEY, INTERNAL_API_SECRET,
#   FRANKFURT_SSH_PASS, HELSINKI_SSH_PASS, LA_SSH_KEY (для операторских тогглов — опционально).
# Переменные ниже (CI_TEST_*) — тестовые значения для smoke-стадии, не секретные.

stages:
  - lint
  - test
  - build
  - e2e
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Кэш npm храним как download-кэш (.npm), НЕ node_modules. Тогда `npm ci`
  # каждый раз собирает node_modules начисто → платформенный SWC-бинарь Next.js
  # (@next/swc-linux-x64-gnu для `next dev` в e2e) всегда присутствует. Кэш
  # самого node_modules приводил к intermittent «Failed to load SWC binary»
  # и падению frontend:e2e.
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/frontend/.npm"
  FF_USE_FASTZIP: "1"

workflow:
  rules:
    # MR-событие → единый авто-пайплайн (все джобы .frontend-rules/.backend-rules
    # матчат первое правило и идут сами, без `when: manual`).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # main → scoped CI (по changes) + авто-деплой. Только main, НЕ произвольная
    # ветка: иначе пуш в feature-ветку плодит второй, дублирующий пайплайн, где
    # джобы падают в `when: manual`/skipped (та самая «стена manual/skipped»).
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web" # ручной запуск из UI
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ── Шаблоны правил: когда запускать ─────────────────────────────────────────
# Self-hosted runner bravada-ci-eu = безлимитные CI-минуты, поэтому все гейты
# (backend/frontend/codegraph) идут АВТОМАТИЧЕСКИ в каждом пайплайне, который
# вообще создаётся (см. workflow:rules выше: MR / main / tag / web / schedule).
# Никаких `changes`-фильтров и `when: manual`-хвостов: именно они порождали
# «стену manual/skipped» — в т.ч. на merge-коммитах в main, где changes по
# diff_refs ненадёжен. Если пайплайн создан — проверки идут сами.
.backend-rules:
  rules:
    - when: on_success

.frontend-rules:
  rules:
    - when: on_success

# Тяжёлые проверки (postgres-интеграции, build, Playwright e2e) — ТОЛЬКО вручную,
# чтобы не сжигать бесплатные CI-минуты (400/мес на private free-неймспейсе).
# Запуск по кнопке перед релизом или при правках в чувствительных местах.
# Радикальное решение лимита — self-hosted gitlab-runner на проде (безлимит, мин. не тратятся).
.manual-rules:
  rules:
    - when: manual
      allow_failure: true

# ════════════════════════════════════════════════════════════════════════════
# BACKEND
# ════════════════════════════════════════════════════════════════════════════
backend:lint:
  stage: lint
  image: python:3.12-slim
  extends: .backend-rules
  interruptible: true
  cache:
    paths: [.cache/pip]
  before_script:
    - pip install ruff==0.11.8
  script:
    - cd backend
    - ruff check src tests
    - ruff format --check src tests

backend:test:
  stage: test
  image: python:3.12-slim
  extends: .backend-rules
  interruptible: true
  cache:
    paths: [.cache/pip]
  before_script:
    - pip install -e ./backend[test]
  script:
    - cd backend
    - python -m compileall src/ -q
    # Интеграционные тесты без БД скипаются (DATABASE_URL не задан) — остаются unit-тесты.
    - python -m pytest -q

# Полный smoke против PostgreSQL (порт backend-postgres-mvp-smoke-validation).
backend:postgres-smoke:
  stage: test
  image: python:3.12-slim
  extends: .backend-rules
  interruptible: true
  services:
    - name: postgres:16-alpine
      alias: db
      variables:
        POSTGRES_USER: slice1ret_ci
        POSTGRES_PASSWORD: slice1retCILocal0nly
        POSTGRES_DB: slice1retention_ci
  variables:
    REPORT_DIR: test-reports
    DATABASE_URL: postgresql://slice1ret_ci:slice1retCILocal0nly@db:5432/slice1retention_ci
    SLICE1_POSTGRES_MVP_SMOKE_ALLOW_MUTATING_TESTS: "1"
    SLICE1_USE_POSTGRES_REPOS: "1"
    BOT_TOKEN: "1234567890:ci_test_bot_token"
    TELEGRAM_STOREFRONT_PLAN_NAME: "CI Test Plan"
    TELEGRAM_STOREFRONT_PLAN_PRICE: "$9.99 test-only"
    TELEGRAM_STOREFRONT_CHECKOUT_URL: "https://checkout.test.local/ci"
    TELEGRAM_STOREFRONT_RENEWAL_URL: "https://checkout.test.local/ci/renew"
    TELEGRAM_STOREFRONT_SUPPORT_URL: "https://support.test.local/ci"
    TELEGRAM_ACCESS_RESEND_ENABLE: "1"
    PAYMENT_FULFILLMENT_HTTP_ENABLE: "1"
    PAYMENT_FULFILLMENT_WEBHOOK_SECRET: "test_only_ci_webhook_secret"
    TELEGRAM_CHECKOUT_REFERENCE_SECRET: "test_only_ci_checkout_reference_secret"
    TELEGRAM_CHECKOUT_REFERENCE_MAX_AGE_SECONDS: "604800"
    TELEGRAM_WEBHOOK_HTTP_ENABLE: "1"
    TELEGRAM_WEBHOOK_SECRET_TOKEN: "test_only_ci_webhook_token_secret"
    TELEGRAM_WEBHOOK_PUBLIC_URL: "https://ci-webhook.safe-domain.org/telegram/webhook"
    TELEGRAM_WEBHOOK_ALLOWED_UPDATES: "message"
    ACCESS_RECONCILE_SCHEDULE_ACK: "1"
    ACCESS_RECONCILE_MAX_INTERVAL_SECONDS: "3600"
    SUBSCRIPTION_DEFAULT_PERIOD_DAYS: "30"
  cache:
    paths: [.cache/pip]
  before_script:
    - pip install -e ./backend[test]
  script:
    - cd backend
    - python -m compileall src/ -q
    - mkdir -p "$REPORT_DIR"
    - python scripts/check_adm01_internal_http_entrypoint_smoke.py
    - python scripts/check_issuance_operator_entrypoint_smoke.py
    - >-
      ( unset DATABASE_URL SLICE1_USE_POSTGRES_REPOS SLICE1_POSTGRES_MVP_SMOKE_ALLOW_MUTATING_TESTS TELEGRAM_WEBHOOK_HTTP_ENABLE PAYMENT_FULFILLMENT_HTTP_ENABLE;
        python -m pytest -q --junitxml="$REPORT_DIR/backend-full-regression.xml" )
    - >-
      python -m pytest -q
      tests/test_run_postgres_mvp_smoke_local.py
      tests/test_run_postgres_mvp_smoke.py
      tests/test_run_slice1_retention_dry_run.py
      --junitxml="$REPORT_DIR/backend-smoke-helper-regression.xml"
    - >-
      set -o pipefail;
      python scripts/validate_release_candidate.py 2>&1
      | tee "$REPORT_DIR/backend-release-candidate-validation.log"
  artifacts:
    when: always
    paths: [backend/test-reports]
    reports:
      junit: backend/test-reports/backend-full-regression.xml

# Opt-in slice-1 retention integration tests (порт второго job'а smoke-workflow).
backend:postgres-retention:
  stage: test
  image: python:3.12-slim
  extends: .backend-rules
  interruptible: true
  services:
    - name: postgres:16-alpine
      alias: db
      variables:
        POSTGRES_USER: slice1ret_ci
        POSTGRES_PASSWORD: slice1retCILocal0nly
        POSTGRES_DB: slice1retention_ci
  variables:
    REPORT_DIR: test-reports
    DATABASE_URL: postgresql://slice1ret_ci:slice1retCILocal0nly@db:5432/slice1retention_ci
  cache:
    paths: [.cache/pip]
  before_script:
